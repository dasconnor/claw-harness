# Secret Menu — custom bot behavior loaded from a local file
#
# Usage:
#   claw-harness run examples/secret-menu.yaml
#
# Demonstrates loading custom instructions from a local file
# and asserting that the bot follows them correctly.

name: "Secret Menu"

bots:
  barista:
    preset: default
    agents_md: "examples/secret-menu/instructions.md"

steps:
  - bot: barista
    prompt: "blue moon"
    timeout: 30s
    expect:
      contains: "lemonade"

  - bot: barista
    prompt: "midnight"
    timeout: 30s
    expect:
      contains: "espresso"

  - bot: barista
    prompt: "pepperoni pizza"
    timeout: 30s
    expect:
      contains: "not on the secret menu"
