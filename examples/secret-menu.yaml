# Secret Menu — load a custom skill and verify the bot follows it
#
# Usage:
#   claw-harness run examples/secret-menu.yaml
#
# Demonstrates loading a SKILL.md from a local path and asserting
# that the bot reads and follows the skill's instructions.

name: "Secret Menu"

bots:
  barista:
    preset: default
    skills:
      - path: "examples/secret-menu/SKILL.md"
        name: secret-menu
    agents_md: >
      You have a skill called "secret-menu" installed in your workspace
      skills directory. Read it when users ask about the secret menu or
      give you code words.

steps:
  - bot: barista
    prompt: "Read your secret-menu skill from the skills directory, then tell me what you get for the code word: blue moon"
    timeout: 30s
    expect:
      contains: "lemonade"

  - bot: barista
    prompt: "Another code word: midnight"
    timeout: 30s
    expect:
      contains: "espresso"

  - bot: barista
    prompt: "How about: pepperoni pizza"
    timeout: 30s
    expect:
      contains: "not on the secret menu"
