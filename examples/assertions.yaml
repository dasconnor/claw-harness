# Assertions — demonstrates contains, not_contains, and matches
#
# Usage:
#   claw-harness run examples/assertions.yaml
#
# Shows how to verify bot responses with step-level assertions.
# The CLI reports pass/fail for each assertion after each step.

name: "Assertion Demo"

bots:
  alpha:
    preset: default

steps:
  - bot: alpha
    prompt: "What is 2 + 2? Reply with just the number, nothing else."
    timeout: 30s
    expect:
      contains: "4"
      not_contains: "5"

  - bot: alpha
    prompt: "List three primary colors, separated by commas."
    timeout: 30s
    expect:
      matches: "(red|blue|yellow)"

  - bot: alpha
    prompt: "Write a one-sentence summary of what HTTP status code 404 means."
    timeout: 30s
    expect:
      contains: "not found"
      not_contains: "500"
